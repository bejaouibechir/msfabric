<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--bg-card:#fff;--bg-sidebar:#fff;--bg-nav:#fff;
  --accent:#0078d4;--accent2:#7c3aed;--accent-hover:#005a9e;
  --text:#1e293b;--text-muted:#64748b;--text-light:#94a3b8;
  --border:#e2e8f0;--border-strong:#cbd5e1;
  --shadow-sm:0 1px 4px rgba(0,0,0,.08);--shadow-md:0 4px 16px rgba(0,0,0,.12);
  --nav-h:56px;--prog-h:3px;--sidebar-w:240px;--card-max:880px;
  --radius:12px;--transition:.2s ease}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:17px;line-height:1.75;overflow:hidden}
/* NAV */
#navbar{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);
  background:var(--bg-nav);border-bottom:1px solid var(--border);
  box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px;padding:0 20px}
#nav-brand{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
.brand-ms{font-size:10px;color:var(--text-muted);font-weight:400;text-transform:uppercase;letter-spacing:.04em}
.brand-fabric{font-size:14px;font-weight:700;color:var(--accent)}
#nav-chapter-badge{flex:1;font-size:.82rem;color:var(--text-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
#nav-controls{display:flex;align-items:center;gap:4px;background:var(--bg);
  border:1px solid var(--border);border-radius:999px;padding:4px 6px;flex-shrink:0}
#btn-prev,#btn-next{display:flex;align-items:center;gap:5px;background:none;border:none;
  color:var(--accent);font-size:.88rem;font-weight:600;cursor:pointer;padding:5px 12px;
  border-radius:999px;transition:background var(--transition),color var(--transition);white-space:nowrap}
#btn-prev:hover,#btn-next:hover{background:var(--accent);color:#fff}
#btn-prev:disabled,#btn-next:disabled{color:var(--text-light);cursor:not-allowed}
#btn-prev:disabled:hover,#btn-next:disabled:hover{background:none}
#slide-counter{font-size:.82rem;font-weight:600;color:var(--text-muted);padding:0 8px;
  border-left:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap}
/* PROGRESS */
#progress-wrap{position:fixed;top:var(--nav-h);left:0;right:0;z-index:99;
  height:var(--prog-h);background:var(--border)}
#progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .3s ease}
/* LAYOUT */
#layout{position:fixed;top:calc(var(--nav-h) + var(--prog-h));bottom:0;left:0;right:0;
  display:flex;overflow:hidden}
/* SIDEBAR */
#sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--bg-sidebar);
  border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#sidebar-title{padding:16px 20px 10px;font-size:.72rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);
  border-bottom:1px solid var(--border);flex-shrink:0}
#chapter-list{list-style:none;overflow-y:auto;flex:1;padding:8px 0}
#chapter-list li{padding:10px 20px;cursor:pointer;font-size:.83rem;color:var(--text-muted);
  border-left:3px solid transparent;
  transition:background var(--transition),color var(--transition),border-color var(--transition);
  display:flex;align-items:flex-start;gap:8px;line-height:1.4}
#chapter-list li:hover{background:var(--bg);color:var(--text);border-left-color:var(--border-strong)}
#chapter-list li.active{background:#eff6ff;color:var(--accent);border-left-color:var(--accent);font-weight:600}
.ch-num{font-size:.7rem;font-weight:700;background:var(--border);border-radius:4px;
  padding:1px 5px;flex-shrink:0;margin-top:1px;color:var(--text-muted)}
li.active .ch-num{background:var(--accent);color:#fff}
/* SLIDE */
#slide-area{flex:1;overflow-y:auto;padding:36px 24px 48px;display:flex;flex-direction:column;align-items:center}
#slide-card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow-md);
  padding:44px 52px;width:100%;max-width:var(--card-max);border:1px solid var(--border)}
#slide-chapter-label{font-size:.78rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--accent);margin-bottom:10px}
#slide-heading{font-size:1.7rem;font-weight:700;color:var(--text);line-height:1.3;
  margin-bottom:28px;padding-bottom:16px;border-bottom:2px solid var(--accent)}
#slide-body{font-size:1rem;color:var(--text)}
#slide-body h2,#slide-body h3,#slide-body h4{margin:24px 0 10px;font-weight:700;line-height:1.3}
#slide-body h2{font-size:1.25rem;color:var(--accent)}
#slide-body h3{font-size:1.08rem;color:var(--accent2);border-left:3px solid var(--accent2);padding-left:10px}
#slide-body p{margin-bottom:12px}
#slide-body ul,#slide-body ol{margin:6px 0 12px 24px}
#slide-body li{margin-bottom:6px}
#slide-body strong{color:#0a3d62;font-weight:700}
#slide-body em{color:var(--accent2);font-style:italic}
#slide-body table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.9rem;
  border-radius:8px;overflow:hidden;border:1px solid var(--border)}
#slide-body th{background:var(--accent);color:#fff;padding:9px 14px;text-align:left;font-weight:600}
#slide-body td{padding:8px 14px;border-bottom:1px solid var(--border)}
#slide-body tr:last-child td{border-bottom:none}
#slide-body tr:nth-child(even) td{background:#f8fafc}
#slide-body pre{background:#f8fafc;padding:16px 18px;border-radius:8px;overflow-x:auto;
  margin:12px 0;border:1px solid var(--border)}
#slide-body code{font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:.84rem}
#slide-body pre code{background:none;padding:0}
#slide-body :not(pre)>code{background:#f1f5f9;padding:2px 6px;border-radius:4px;
  border:1px solid var(--border);color:#be185d}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
/* HERO */
.hero-slide{display:flex;flex-direction:column;gap:24px}
.hero-badge{display:inline-block;background:var(--accent);color:#fff;font-size:.78rem;
  font-weight:700;letter-spacing:.06em;padding:5px 14px;border-radius:999px;
  text-transform:uppercase;width:fit-content}
.hero-subtitle{font-size:1.08rem;color:var(--text-muted);line-height:1.65;
  border-left:4px solid var(--accent);padding-left:16px}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.hero-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:18px;display:flex;flex-direction:column;gap:8px}
.hero-card strong{color:var(--accent);font-size:.95rem}
.hero-card p{font-size:.85rem;color:var(--text-muted);margin:0}
.hero-icon{font-size:1.7rem}
.hero-onelake{background:linear-gradient(135deg,#eff6ff,#f5f3ff);
  border:1px solid #bfdbfe;border-radius:10px;padding:14px 18px;
  font-size:.9rem;color:var(--text)}
/* WORKLOAD GRID */
.workload-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.wl-card{display:flex;align-items:flex-start;gap:12px;background:var(--bg);
  border:1px solid var(--border);border-left:4px solid var(--accent);
  border-radius:8px;padding:12px}
.wl-factory{border-left-color:#0078d4}.wl-eng{border-left-color:#7c3aed}
.wl-lake{border-left-color:#059669}.wl-wh{border-left-color:#d97706}
.wl-rt{border-left-color:#dc2626}.wl-pbi{border-left-color:#f59e0b}
.wl-sci{border-left-color:#0891b2}.wl-act{border-left-color:#6366f1}
.wl-icon{font-size:1.5rem;flex-shrink:0;margin-top:2px}
.wl-info{display:flex;flex-direction:column;gap:3px}
.wl-info strong{font-size:.9rem;color:var(--text)}
.wl-info span{font-size:.8rem;color:var(--text-muted);line-height:1.4}
/* TOOLS */
.tool-list{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.tool-item{display:flex;gap:14px;background:var(--bg);
  border:1px solid var(--border);border-radius:8px;padding:12px}
.tool-icon{font-size:1.4rem;flex-shrink:0}
.tool-body strong{color:var(--accent)}
.tool-body p{font-size:.86rem;color:var(--text-muted);margin:3px 0 0}
/* SECURITY LAYERS */
.security-layers{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.sec-layer{display:grid;grid-template-columns:200px 1fr;
  border:1px solid var(--border);border-left:5px solid var(--lc,var(--accent));
  border-radius:8px;overflow:hidden}
.sec-layer-title{background:var(--bg);padding:12px 14px;font-weight:700;
  font-size:.85rem;color:var(--text);display:flex;align-items:center;
  border-right:1px solid var(--border)}
.sec-layer-body{padding:10px 14px;font-size:.85rem;color:var(--text-muted);
  line-height:1.5;background:#fff}
/* ROLES */
.roles-table{display:flex;flex-direction:column;gap:8px}
.role-row{display:grid;grid-template-columns:100px 1fr;
  border:1px solid var(--border);border-radius:8px;overflow:hidden}
.role-badge{display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.9rem;text-align:center;padding:10px 6px;color:#fff}
.role-admin .role-badge{background:#dc2626}.role-member .role-badge{background:#d97706}
.role-contributor .role-badge{background:#059669}.role-viewer .role-badge{background:#64748b}
.role-perms{padding:8px 14px;background:var(--bg)}
.role-perms ul{list-style:none;margin:0;padding:0}
.role-perms li{font-size:.8rem;padding:2px 0;color:var(--text)}
/* SECURITY SUMMARY */
.security-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.ss-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:10px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.ss-item span:first-child{font-size:1.1rem}
.ss-item span:last-child{font-size:.78rem;color:var(--text-muted)}
</style>
</head>

    chapterTitle: "GRANT & DENY – Warehouse",
    title: "Les GRANT et DENY dans le Warehouse",
    content: `<p>Le Data Warehouse Fabric supporte des <strong>permissions SQL granulaires</strong> via T-SQL.</p>
<h3>GRANT — accorder des droits</h3>
<pre><code>-- Lecture sur un schema entier
GRANT SELECT ON SCHEMA::dbo TO [utilisateur@domaine.com];

-- Lecture sur une table specifique
GRANT SELECT ON dbo.ventes TO [analyste@domaine.com];

-- Acces via un groupe Entra ID
GRANT SELECT ON dbo.clients TO [GroupeAnalyse@domaine.com];

-- Ecriture (DML)
GRANT INSERT, UPDATE ON dbo.ventes TO [ingenieur@domaine.com];

-- Execution d'une procedure stockee
GRANT EXECUTE ON dbo.sp_calcul_kpi TO [app-service@domaine.com];</code></pre>
<h3>DENY — refuser explicitement</h3>
<pre><code>-- Bloquer une colonne (Column-Level Security)
DENY SELECT ON dbo.employes(salaire) TO [analyste@domaine.com];

-- Bloquer une table entiere
DENY SELECT ON dbo.donnees_confidentielles TO [externe@domaine.com];

-- DENY prime TOUJOURS sur GRANT, meme via un groupe</code></pre>
<h3>REVOKE</h3>
<pre><code>REVOKE SELECT ON dbo.ventes FROM [utilisateur@domaine.com];</code></pre>
<h3>Row-Level Security (RLS)</h3>
<pre><code>CREATE SCHEMA Security;
CREATE FUNCTION Security.fn_filtre_region(@region NVARCHAR(50))
  RETURNS TABLE WITH SCHEMABINDING AS RETURN
  SELECT 1 AS ok
  WHERE @region = USER_NAME()
     OR IS_ROLEMEMBER('admin_role') = 1;

CREATE SECURITY POLICY FiltreRegion
  ADD FILTER PREDICATE Security.fn_filtre_region(region)
  ON dbo.ventes WITH (STATE = ON);</code></pre>
<p style="font-size:.88rem;color:var(--text-muted);margin-top:8px;">💡 <strong>Règle d'or</strong> : DENY &gt; GRANT — un DENY annule tout GRANT, même via un groupe.</p>`

(function() {
  const TOTAL = SLIDES.length;
  let current = 0;

  const dom = {
    chapterBadge: document.getElementById('nav-chapter-badge'),
    counter:      document.getElementById('slide-counter'),
    btnPrev:      document.getElementById('btn-prev'),
    btnNext:      document.getElementById('btn-next'),
    progressBar:  document.getElementById('progress-bar'),
    chapterList:  document.getElementById('chapter-list'),
    chapterLabel: document.getElementById('slide-chapter-label'),
    heading:      document.getElementById('slide-heading'),
    body:         document.getElementById('slide-body'),
  };

  function buildSidebar() {
    dom.chapterList.innerHTML = '';
    SLIDES.forEach((s, i) => {
      const li = document.createElement('li');
      li.dataset.idx = i;
      li.innerHTML = `<span class="ch-num">${i + 1}</span><span>${s.chapterTitle}</span>`;
      li.addEventListener('click', () => goTo(i));
      dom.chapterList.appendChild(li);
    });
  }

  function goTo(idx) {
    current = Math.max(0, Math.min(TOTAL - 1, idx));
    const s = SLIDES[current];
    dom.chapterLabel.textContent = s.chapterTitle;
    dom.heading.textContent = s.title;
    dom.body.innerHTML = s.content || '';
    dom.chapterBadge.textContent = s.chapterTitle;
    dom.counter.textContent = `${current + 1} / ${TOTAL}`;
    dom.progressBar.style.width = `${((current + 1) / TOTAL) * 100}%`;
    dom.btnPrev.disabled = current === 0;
    dom.btnNext.disabled = current === TOTAL - 1;
    document.querySelectorAll('#chapter-list li').forEach((li, i) => {
      li.classList.toggle('active', i === current);
    });
    const active = document.querySelector('#chapter-list li.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
    document.getElementById('slide-area').scrollTop = 0;
  }

  dom.btnPrev.addEventListener('click', () => goTo(current - 1));
  dom.btnNext.addEventListener('click', () => goTo(current + 1));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') goTo(current + 1);
    if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   goTo(current - 1);
  });

  buildSidebar();
  goTo(0);
})();

</script>
